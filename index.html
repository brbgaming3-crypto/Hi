<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden
}
body{
  font-family:"DM Sans",sans-serif;
  background:#241426
}
button,input{font:inherit}

#intro-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:linear-gradient(135deg,#241426,#482141);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  text-align:center;
  padding:20px;
  touch-action:manipulation;
}

#intro-overlay h1{
  font-family:"Fredoka",sans-serif;
  font-size:36px;
  margin-bottom:12px
}

#intro-overlay p{
  font-size:18px;
  opacity:.85;
  animation:pulseText 1.5s ease-in-out infinite
}

@keyframes pulseText{
  0%,100%{transform:scale(1);opacity:.85}
  50%{transform:scale(1.05);opacity:1}
}

.app{
  position:relative;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(135deg,#fff4f8,#ffdce9 52%,#eee0f7);
}

.app:before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.42),transparent 28%),
    radial-gradient(circle at 20% 85%,rgba(255,132,170,.18),transparent 25%),
    radial-gradient(circle at 85% 15%,rgba(190,130,220,.16),transparent 25%);
  animation:ambient 8s ease-in-out infinite;
  pointer-events:none
}

.modal{
  position:relative;
  width:min(95vw,420px);
  height:100%;
  min-height:560px;
  padding:20px;
  text-align:center;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center
}

.title{
  position:absolute;
  top:9%;
  left:18px;
  right:18px;
  margin:0;
  font-family:"Fredoka",sans-serif;
  font-size:34px;
  font-weight:700;
  line-height:1.12;
  z-index:8
}

.sub{
  position:absolute;
  top:55%;
  left:22px;
  right:22px;
  margin:0;
  font-size:17px;
  font-weight:600;
  line-height:1.35;

.gallery{

  top:15%;

  width:min(94%,390px);
  height:57%;
  z-index:6;
  pointer-events:none
}

.gallery img{
  position:absolute;
  width:clamp(55px,17vw,74px);
  height:clamp(55px,17vw,74px);
  object-fit:contain;
  border-radius:16px;
  filter:drop-shadow(0 7px 13px rgba(72,25,55,.18));

}

.gallery img:nth-child(1){
  left:calc(50% - clamp(38px,11.5vw,48px));
  top:calc(50% - clamp(38px,11.5vw,48px));
  width:clamp(76px,23vw,96px);
  height:clamp(76px,23vw,96px)
}

.gallery img:nth-child(2){left:7%;top:7%}
.gallery img:nth-child(3){right:5%;top:10%}
.gallery img:nth-child(4){left:2%;top:62%}
.gallery img:nth-child(5){right:3%;top:58%}
.gallery img:nth-child(6){
  left:calc(50% - clamp(27px,8.5vw,37px));
  bottom:1%
}

@keyframes galleryFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}

}

.hidden{display:none!important}

.face{

.face img{

.buttons{

.choices-container{

.choice-chip{

  color:#682846;
  border:2px solid #ff5b81;
  border-radius:20px;
  padding:8px 14px;
  font-size:14px;

.choice-chip.selected{

.other-input{
  width:100%;

  background:rgba(255,255,255,.96);

  font-weight:600;

  margin-top:4px;

.layer{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none
}

.hearts{z-index:1;opacity:.2}
.sparkles{
  z-index:2;
  opacity:.28;
  background-image:radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.8px);
  background-size:38px 38px;
  animation:sparkleDrift 12s linear infinite
}
.candies{z-index:2;opacity:0}

.heart{
  position:absolute;
  font-size:clamp(17px,4vw,33px);
  animation:heartFloat linear infinite
}

.candy{
  position:absolute;
  font-size:21px;
  animation:candyFloat 6s ease-in-out infinite
}

.yay-title{
  font-family:"Pacifico",cursive!important;
  color:#fff!important;
  text-shadow:0 7px 22px rgba(80,30,60,.25)!important;
  line-height:1.15!important
}

.yes-sub{
  margin-top:13px;
  font-family:"DM Sans",sans-serif;
  font-size:19px;
  font-weight:700;
  color:#fff
}

.postcat{
  position:absolute!important;
  left:50%!important;
  top:48%!important;
  transform:translate(-50%,-50%)!important;
  width:88px!important;
  height:88px!important;
  object-fit:contain!important;
  z-index:6!important
}

.final{
  font-size:32px!important;
  text-shadow:0 0 24px rgba(255,76,117,.75)!important
}

@keyframes ambient{
  0%,100%{transform:scale(1);opacity:.72}
  50%{transform:scale(1.08);opacity:1}
}

@keyframes pulse{
  0%,100%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.055)}
}

@keyframes heartFloat{
  0%{transform:translateY(110vh) rotate(-12deg);opacity:0}
  15%{opacity:.7}
  100%{transform:translateY(-18vh) rotate(18deg);opacity:0}
}

@keyframes sparkleDrift{

@keyframes candyFloat{

  50%{transform:translateY(-15px) rotate(7deg)}

@media(max-width:430px){
  .title{font-size:32px}
  .buttons{gap:10px}
  .yes{font-size:19px;padding:12px 25px}
  .no{font-size:15px;padding:9px 19px}
  .continue{font-size:18px;padding:15px 29px}
}
</style>
</head>

<script>
"use strict";

/* =========================
   CONFIG
========================= */

const WEB3FORMS_ACCESS_KEY =
"5891b914-d1f4-46ca-be59-06345b9b5850";

const $ = id => document.getElementById(id);

const app = $("app");
const modal = $("modal");
const face = $("face");
const reactionGif = $("reactionGif");
const title = $("title");
const sub = $("sub");
const buttons = $("buttons");
const yes = $("yes");
const no = $("no");
const date = $("date");
const cont = $("cont");
const hearts = $("hearts");
const candies = $("candies");
const gallery = $("gallery");
const choicesContainer = $("choicesContainer");
const introOverlay = $("intro-overlay");

let state = 0;
let noPresses = 0;
let selectedChoices = new Set();
let currentAudio = null;
let audioCtx = null;


/* =========================
   AUDIO
========================= */

const startTimes = {
  "intro.mp3":64,
  "no4.mp3":31,
  "no9.mp3":41,
  "date.mp3":10,
  "date1.mp3":27,
  "yay.mp3":0
};

async function ensureAudioContext(){

  try{

    if(!audioCtx){
      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(AudioContext){
        audioCtx = new AudioContext();
      }
    }

    if(audioCtx && audioCtx.state === "suspended"){
      await audioCtx.resume();
    }

  }catch(error){

    console.warn(
      "Audio context unavailable:",
      error
    );

  }

}

function stopAudio(){

  if(currentAudio){

    try{
      currentAudio.pause();
      currentAudio.currentTime = 0;
    }catch(e){}

    currentAudio = null;
  }

}

function playMp3(filename, loopMode=false){

  stopAudio();

  const audio = new Audio();

  currentAudio = audio;

  audio.loop = loopMode;
  audio.preload = "auto";
  audio.src = filename;

  const startTime =
    startTimes[filename] || 0;

  audio.addEventListener(
    "loadedmetadata",
    () => {

      if(
        Number.isFinite(audio.duration) &&
        startTime < audio.duration
      ){
        audio.currentTime = startTime;
      }

    },
    {once:true}
  );

  audio.play().catch(error => {

    /*
      IMPORTANT:
      Missing audio must NEVER break
      the interactive page.
    */

    console.warn(
      "Audio unavailable:",
      filename,
      error
    );

  });

}


/* =========================
   FIXED INTRO OVERLAY
========================= */

async function openIntro(){

  if(
    !introOverlay ||
    introOverlay.dataset.opened === "1"
  ){
    return;
  }

  introOverlay.dataset.opened = "1";

  /*
    The user gesture is still active here,
    so browsers allow audio to be started.
  */
  await ensureAudioContext();

  /*
    REMOVE THE OVERLAY FIRST.
    This is the main fix.
  */
  introOverlay.remove();

  /*
    Audio is completely optional.
    If intro.mp3 doesn't exist, the page
    still works normally.
  */
  playMp3("intro.mp3", true);

}


/*
  pointerup works much more reliably on
  Android/mobile browsers than relying only
  on click.
*/
introOverlay.addEventListener(
  "pointerup",
  openIntro,
  {once:true}
);

introOverlay.tabIndex = 0;


/* =========================
   CAT GIFS
========================= */

const fallbackCat =
"https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg";

const gifs = [

"https://media1.tenor.com/m/9EWwYOJnM_oAAAAd/cute-cats.gif",

"https://media1.tenor.com/m/cxTH4XWKUVIAAAAd/cat.gif",

"https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif",

"https://media1.tenor.com/m/d9PoZm99CTgAAAAd/sadcat-crying-cat.gif",

"https://media1.tenor.com/m/hLuI_mGw57cAAAAd/sad-cat.gif",

"https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif",

"https://media1.tenor.com/m/d9PoZm99CTgAAAAd/sadcat-crying-cat.gif",

"https://media1.tenor.com/m/hLuI_mGw57cAAAAd/sad-cat.gif",

"https://media1.tenor.com/m/wk8ueqUDJBsAAAAd/cat-cry-cute.gif"

];

function safeImage(url){

  reactionGif.onerror = function(){

    reactionGif.onerror = null;

    reactionGif.src = fallbackCat;

  };

  reactionGif.src = url;

}


/* =========================
   CHOICES
========================= */

const choicesList = [

  "cokefloat date",
  "haru",
  "freedom",
  "mang-afam",
  "jollibee",
  "mcdo",
  "lee plaza",
  "evermall",
  "boulivard",
  "others"

];


/* =========================
   NO STATES
========================= */

const S = [

{
  bg:"linear-gradient(135deg,#fff4f8,#ffdce9 52%,#eee0f7)",
  yes:"YES",
  msg:""
},

{
  bg:"linear-gradient(135deg,#fce8f0,#edc8dc 52%,#dfcbe9)",
  yes:"YES",
  msg:"Are you sure? 🥺"
},

{
  bg:"linear-gradient(135deg,#f3c2d7,#d9afd0 52%,#c1b3dc)",
  yes:"YES!",
  msg:"Please? =("
},

{
  bg:"linear-gradient(135deg,#dfa1bf,#bd8db2 52%,#9d8fbf)",
  yes:"YES!",
  msg:"I really want you to say yes 🥹"
},

{
  bg:"linear-gradient(135deg,#c680a7,#a06f98 52%,#716687)",
  yes:"YES",
  msg:"Nooo... please don't do tis :<"
},

{
  bg:"linear-gradient(135deg,#a45f8c,#80577e 52%,#57536f)",
  yes:"YES",
  msg:"Me is getting sad... :("
},

{
  bg:"linear-gradient(135deg,#81486f,#624766 52%,#3f3c58)",
  yes:"YES",
  msg:"You're breaking my heart... 💔"
},

{
  bg:"linear-gradient(135deg,#633957,#4b344e 52%,#302b40)",
  yes:"YES",
  msg:"Heart broken </3"
},

{
  bg:"linear-gradient(135deg,#47263f,#352336 52%,#211c2c)",
  yes:"YES",
  msg:"Please..?😔"
}

];


/* =========================
   BASE RESET
========================= */

function resetBase(bg){

  app.style.background = bg;

  title.className = "title";
  sub.className = "sub hidden";
  buttons.className = "buttons";
  date.className = "date hidden";
  choicesContainer.className =
    "choices-container hidden";

  cont.className = "continue hidden";
  face.className = "face";

  title.style.cssText = "";
  sub.style.cssText = "";
  yes.style.cssText = "";
  no.style.cssText = "";

  buttons.style.bottom = "17%";

  candies.style.opacity = "0";

  gallery.style.display = "none";
}


/* =========================
   APPLY NO STATE
========================= */

function apply(n){

  state = n;

  const s = S[n];

  resetBase(s.bg);

  const openingScreen = n === 0;

  gallery.style.display =
    openingScreen ? "block" : "none";

  face.style.display =
    openingScreen ? "none" : "grid";

  safeImage(
    gifs[Math.min(n,gifs.length-1)]
  );

  face.style.width =
    (n < 4 ? 84 : n < 7 ? 78 : 72) + "px";

  face.style.height =
    face.style.width;

  face.style.top = "38%";

  title.textContent =
    n >= 7
      ? "will you go out with me?"
      : "Will you go out with me?";

  title.style.color =
    n < 4 ? "#642e4e" : "#fff";

  title.style.fontSize = "34px";


  if(s.msg){

    sub.textContent = s.msg;

    sub.className = "sub";

    sub.style.color =
      n < 4
        ? "#7a3a5b"
        : "rgba(255,255,255,.94)";

    sub.style.top = "55%";

    if(n >= 6){
      sub.style.textShadow =
        "0 0 14px rgba(255,84,125,.8)";
    }

  }


  yes.textContent = s.yes;


  /*
    YES grows slowly.
  */
  const yesScale =
    1 + (noPresses * 0.12);

  yes.style.fontSize =
    Math.min(
      31,
      20 + noPresses * 1.15
    ) + "px";

  yes.style.padding =
    (13 + noPresses * .5) +
    "px " +
    (31 + noPresses * 1.25) +
    "px";

  yes.style.transform =
    "scale(" +
    Math.min(1.28,yesScale) +
    ")";

  yes.style.zIndex = "11";


  /*
    NO shrinks.
  */
  const shrink =
    Math.pow(.62,noPresses);

  no.style.width =
    Math.max(10,48 * shrink) + "px";

  no.style.height =
    Math.max(10,38 * shrink) + "px";

  no.style.padding = "0";

  no.style.fontSize =
    Math.max(2.2,16 * shrink) + "px";

  no.style.opacity =
    Math.max(
      .08,
      1 - noPresses * .105
    );

  no.style.borderWidth =
    noPresses >= 6 ? "0" : "1px";


  buttons.style.gap =
    Math.max(
      3,
      16 - noPresses * 1.5
    ) + "px";

  buttons.style.bottom =
    noPresses >= 6
      ? "16%"
      : "17%";


  hearts.style.opacity =
    n === 0
      ? ".10"
      : n < 4
      ? ".28"
      : n < 7
      ? ".45"
      : ".62";

  candies.style.opacity =
    n >= 4 ? ".35" : "0";
}


/* =========================
   FINAL SCREEN HELPERS
========================= */

function baseFinal(bg){

  resetBase(bg);

  gallery.style.display = "none";

  face.className =
    "face hidden";

  buttons.className =
    "buttons hidden";

  sub.className =
    "sub hidden";

  hearts.style.opacity = ".75";

  candies.style.opacity = ".45";
}

function clearPostCat(){

  document
    .querySelectorAll(".postcat")
    .forEach(x => x.remove());

}


/* =========================
   YES SCREEN
========================= */

function show9(){

  state = 9;

  playMp3("yay.mp3",false);

  clearPostCat();

  baseFinal(
    "linear-gradient(135deg,#7d466c,#b9678d 52%,#e7b4cc)"
  );

  title.innerHTML =

  title.className =

  title.style.top = "21%";

  title.style.fontSize = "78px";


  const cat =

  cat.className = "postcat";

  cat.alt = "happy cat";

  };

  cont.className =

  cont.style.bottom =

}


/* =========================
   DATE SCREEN
========================= */

function show10(){

  state = 10;

  playMp3("date.mp3",true);

  clearPostCat();

  baseFinal(
    "linear-gradient(135deg,#f1b8d5,#cdb7e5 52%,#aebfe8)"
  );

  title.textContent =
    "PICK A DATE";

/* =========================
   ACTIVITY SCREEN
========================= */

function show11(){

  state = 11;

  playMp3("date1.mp3", true);

  baseFinal(
    "linear-gradient(135deg,#f1b8d5,#cdb7e5 52%,#aebfe8)"
  );

  title.textContent = "WHAT SHALL WE DO?";
  title.className = "title";
  title.style.top = "12%";
  title.style.fontSize = "26px";
  title.style.color = "#fff";

  choicesContainer.className = "choices-container";
  choicesContainer.innerHTML = "";

  choicesList.forEach(item => {

    const chip = document.createElement("div");

    chip.className =
      "choice-chip" +
      (selectedChoices.has(item) ? " selected" : "");

    chip.textContent = item;

    chip.addEventListener("click", () => {

      if (selectedChoices.has(item)) {

        selectedChoices.delete(item);
        chip.classList.remove("selected");

        if (item === "others") {

          const inp = $("otherTextInput");

          if (inp) inp.remove();

        }

      } else {

        selectedChoices.add(item);
        chip.classList.add("selected");

        if (item === "others") {

          /*
           * Prevent duplicate Others input
           */
          if (!$("otherTextInput")) {

            const inp = document.createElement("input");

            inp.id = "otherTextInput";
            inp.placeholder =
              "Type your custom place/activity...";
            inp.className = "other-input";

            choicesContainer.appendChild(inp);

          }

        }

      }

    });

    choicesContainer.appendChild(chip);

  });

  cont.textContent = "FINISH 💕";
  cont.className = "continue";
  cont.style.bottom = "8%";

}


/* =========================
   SEND DATA TO EMAIL
========================= */

function sendDataToEmail(
  chosenDate,
  choicesArray,
  customOther
){

  if (
    !WEB3FORMS_ACCESS_KEY ||
    WEB3FORMS_ACCESS_KEY === "YOUR_ACCESS_KEY_HERE"
  ){

    console.warn(
      "Web3Forms Access Key is missing!"
    );

    return;

  }

  const formData = new FormData();

  formData.append(
    "access_key",
    WEB3FORMS_ACCESS_KEY
  );

  formData.append(
    "subject",
    "💖 Someone answered your invitation!"
  );

  formData.append(
    "Date Selected",
    chosenDate
  );

  formData.append(
    "Activities Picked",
    choicesArray.join(", ") ||
    "None selected"
  );

  if (customOther) {

    formData.append(
      "Custom 'Others' Text",
      customOther
    );

  }

  fetch(
    "https://api.web3forms.com/submit",
    {
      method: "POST",
      body: formData
    }
  )
  .then(response => {

    if (!response.ok) {
      throw new Error(
        "Web3Forms request failed"
      );
    }

    return response.json();

  })
  .then(data => {

    console.log(
      "Response submitted:",
      data
    );

  })
  .catch(error => {

    console.error(
      "Error submitting response:",
      error
    );

  });

}

     */

       */
      if (!date.value.trim()) {

        date.value = "09/07/2026";

      }

      show11();

      return;

    }

     * FINAL SCREEN
     */
    if (state === 11) {

      show12();

      return;

    }

  }
);


/* =========================
   DATE INPUT
========================= */

/*
 * Automatically format:
 *
 * 09072026
 *
 * into:
 *
 * 09/07/2026
 */
date.addEventListener(
  "input",
  () => {

    let value =
      date.value.replace(/\D/g, "");

    if (value.length > 8) {
      value = value.slice(0, 8);
    }

    if (value.length >= 5) {

      value =
        value.slice(0,2) +
        "/" +
        value.slice(2,4) +
        "/" +
        value.slice(4);

    }

    else if (value.length >= 3) {

      value =
        value.slice(0,2) +
        "/" +
        value.slice(2);

    }

    date.value = value;

  }
);
